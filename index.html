<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Daily Report</title>
  <link rel="stylesheet" href="index3.css?v=20261018-1">
</head>
<body>
<button
  type="button"
  id="themeToggleBtn"
  aria-pressed="false"
  aria-label="เปลี่ยนเป็นโหมดมืด"
>
  <span id="themeIcon">🌙</span>
  <span id="themeText">โหมดมืด</span>
</button>
  <h1 id="reportHeading">Daily Report</h1>
  <p id="liffUserInfo" role="status" aria-live="polite">
  กำลังตรวจสอบผู้ใช้ LINE...
  </p>

  
  <form id="reportForm" aria-labelledby="reportHeading">
    <p>
      <button
    type="button"
    id="openSupervisorReportButton"
    onclick="window.location.href='supervisor.html'"
  >
    📣 ส่งรายงานต่อหัวหน้า
  </button>
    </p>
    
    <p>
      <label for="date">Date</label><br>
      <input
        type="date"
        id="date"
        required
      >
    </p>

    <p>
      <label for="shift">Shift</label><br>
      <select id="shift" required>
        <option value="">-- Select Shift --</option>
        <option value="DAY">DAY</option>
        <option value="Night">Night</option>
      </select>
    </p>

    <p>
      <label for="line">Line</label><br>
      <select id="line" required>
        <option value="">-- Select Line --</option>
        <option value="J17">J17</option>
        <option value="K27">K27</option>
      </select>
    </p>

    <p>
      <label for="model">Model</label><br>
        <select id="model" required>
        <option value="">-- Select Model --</option>
        </select>
    </p>

    <p>
      <label for="machine">Machine</label><br>
      <select id="machine" required>
        <option value="">-- Select Machine --</option>
        <option value="BFT">BFT</option>
        </select>
    </p>

    <p>
      <label for="pass">Pass / OK</label><br>
      <input
        type="number"
        id="pass"
        min="0"
        required
      >
    </p>

    <p>
      <label for="fail">Fail / NG</label><br>
      <input
        type="number"
        id="fail"
        min="0"
        required
      >
    </p>

    <p>
      <label for="wip">WIP</label><br>
      <input
        type="number"
        id="wip"
        min="0"
        required
      >
    </p>

    
    <p>
    <input
      type="checkbox"
      id="appendProblem"
    >
    <label for="appendProblem">➕ เพิ่มเป็นปัญหาใหม่</label>
</p>
    <p>
      <label for="issue">Issue / ปัญหา</label><br>
        <textarea
            id="issue"
            rows="6"
            placeholder="ตัวอย่าง:
            1. Sensor Error
            2. Barcode อ่านไม่ได้
            3. Jig มีปัญหา"
        ></textarea>
    </p>

    <p>
      <label for="solution">วิธีแก้</label><br>
        <textarea
            id="solution"
            rows="6"
            placeholder="ตัวอย่าง:
            1. Reset Sensor และตรวจสาย
            2. ทำความสะอาด Scanner
            3. ปรับตำแหน่ง Jig"
        ></textarea>
    </p>

    <p>
      <label for="fixTime">เวลาในการแก้</label><br>
      <input
        type="text"
        id="fixTime"
      >
    </p>
    <p>
  <label for="images">รูปภาพ</label><br>

  <input
    type="file"
    id="images"
    accept="image/jpeg,image/png"
    multiple
  >
    </p>
<button
  type="button"
  id="clearImagesButton"
  style="display: none;"
>
  ล้างรูป
</button>
    <p>
  <span class="field-label">ตัวอย่างรูป</span><br>

  <canvas
    id="collageCanvas"
    role="img"
    aria-label="ตัวอย่างภาพที่เลือกสำหรับรายงาน"
    style="max-width: 100%; border: 1px solid #ccc;"
  ></canvas>
    </p>

    <p>
      <label for="remark">Remark</label><br>
      <textarea
        id="remark"
        rows="4"
        placeholder="หมายเหตุเพิ่มเติม"
        ></textarea>
    </p>

    <p
      id="formStatus"
      class="status-message"
      role="status"
      aria-live="polite"
    ></p>

    <p>
      <button type="submit" 
      id="submitButton">
        ส่งรายงาน
      </button>
    </p>

  </form>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="app.js?v=20261018-1"></script>
  <script>
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    // ฟังก์ชันอัปเดตข้อความบนปุ่ม
    function updateButtonUI(isDark) {
      if (isDark) {
        themeIcon.textContent = '☀️';
        themeText.textContent = 'โหมดสว่าง';
        themeToggleBtn.setAttribute('aria-label', 'เปลี่ยนเป็นโหมดสว่าง');
      } else {
        themeIcon.textContent = '🌙';
        themeText.textContent = 'โหมดมืด';
        themeToggleBtn.setAttribute('aria-label', 'เปลี่ยนเป็นโหมดมืด');
      }

      themeToggleBtn.setAttribute('aria-pressed', String(isDark));
    }

    // ดึงค่าโหมดที่เคยเก็บบันทึกไว้
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
    }

    updateButtonUI(document.body.classList.contains('dark-mode'));

    // เหตุการณ์เมื่อกดปุ่มสลับโหมด
    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      
      // บันทึกสถานะไว้ในความจำของ Browser
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      
      // เปลี่ยนไอคอนและข้อความบนปุ่ม
      updateButtonUI(isDark);
    });
  </script>

</body>

</html>
