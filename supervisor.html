<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Supervisor Report</title>

  <link
    rel="stylesheet"
    href="index3.css"
  >
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

  <h1>📣 ส่งรายงานต่อหัวหน้า</h1>

  <div>

    <p>
      <label>Date</label><br>

      <input
        type="date"
        id="supervisorDate"
      >
    </p>

    <p>
      <label>Shift</label><br>

      <select id="supervisorShift">

        <option value="">
          -- Select Shift --
        </option>

        <option value="DAY">
          DAY
        </option>

        <option value="Night">
          Night
        </option>

      </select>
    </p>

    <p>
      <label>Line</label><br>

      <select id="supervisorLine">

        <option value="">
          -- Select Line --
        </option>

        <option value="J17">
          J17
        </option>

        <option value="K27">
          K27
        </option>

      </select>
    </p>

    <p>
      <button
        type="button"
        id="searchSupervisorButton"
      >
        🔎 ค้นหารายงาน
      </button>
    </p>
    
    <div id="supervisorPreview" style="display: none;">
  <hr>

  <h2>Preview</h2>

  <div id="supervisorReportText"></div>

</div>

    <p>
      <button
        type="button"
        onclick="window.location.href='index.html'"
      >
        ← กลับหน้า Daily Report
      </button>
    </p>

  </div>


<script>
  document.addEventListener(
  'DOMContentLoaded',
  async function () {

    try {

      await liff.init({
        liffId: '2011529431-bRn6gKcu'
      });

      console.log('LIFF INIT SUCCESS');

    } catch (error) {

      console.error(
        'LIFF INIT ERROR:',
        error
      );

      alert(
        'LIFF เริ่มต้นไม่สำเร็จ\n' +
        error.message
      );

    }

    const dateInput =
      document.getElementById(
        'supervisorDate'
      );

    const today = new Date();

    const year =
      today.getFullYear();

    const month =
      String(today.getMonth() + 1)
        .padStart(2, '0');

    const day =
      String(today.getDate())
        .padStart(2, '0');

    dateInput.value =
      `${year}-${month}-${day}`;

  }
);
</script>

<script>

  const GAS_URL =
    'https://script.google.com/macros/s/AKfycbz14A1FjQRCWOT427jwoLhEG-UTRgPTFS8gguUWTppOJ4Jnjacd-QxQ4R4yD18Cx6i0/exec';


  document
    .getElementById('searchSupervisorButton')
    .addEventListener('click', async function () {

      const button = this;

      try {

        const dateValue =
          document.getElementById('supervisorDate').value;

        const shift =
          document.getElementById('supervisorShift').value;

        const line =
          document.getElementById('supervisorLine').value;


        if (!dateValue || !shift || !line) {
          alert('กรุณาเลือก Date / Shift / Line ให้ครบ');
          return;
        }


        const dateParts =
          dateValue.split('-');

        const reportDate =
          `${dateParts[0]}/${dateParts[1]}/${dateParts[2]}`;


        button.disabled = true;
        button.textContent = 'กำลังค้นหา...';


        const response = await fetch(
          GAS_URL,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body: JSON.stringify({
              action: 'findSupervisorReport',
              date: reportDate,
              shift: shift,
              line: line
            })
          }
        );


        const data =
          await response.json();


        console.log(
          'SUPERVISOR SEARCH RESULT:',
          data
        );


        if (!data.success) {
          throw new Error(
            data.error ||
            'เกิดข้อผิดพลาดในการค้นหารายงาน'
          );
        }


        if (!data.result.found) {

          alert(
            'ไม่พบรายงาน\n\n' +
            'Date: ' + reportDate + '\n' +
            'Shift: ' + shift + '\n' +
            'Line: ' + line
          );

          return;
        }


      
const report = data.result;

const preview =
  document.getElementById('supervisorPreview');

const reportText =
  document.getElementById('supervisorReportText');


// จำนวน Fixture ทั้งหมดของแต่ละ Line
const fixtureTotal =
  report.line === 'J17'
    ? 33
    : 36;


// เวลารายงานตาม Shift
const reportTime =
  report.shift === 'Night'
    ? '08.00'
    : '20.00';

reportText.innerHTML = `
  <p><strong>BFT TEAM</strong></p>

  <p>Date: ${report.date}</p>

  <p>
    F7 ${report.shift}-SHIFT ${report.line}
  </p>

  <p>MODEL: ${report.model}</p>

  <p>STATION: FT</p>

  <label for="usableFixtures">
    Number of usable fixtures (${reportTime})
  </label>

  <div>
    <input
      type="number"
      id="usableFixtures"
      min="0"
      max="${fixtureTotal}"
      placeholder="จำนวนที่ใช้ได้"
    >

    <strong>
      / ${fixtureTotal}
    </strong>
  </div>

  <p>
    <label for="overallSituation">
      Overall situation
    </label>
    <br>

    <select id="overallSituation">
      <option value="Normal">
        Normal
      </option>

      <option value="Abnormal">
        Abnormal
      </option>
    </select>
  </p>

  <p>
    Number of WIP (${reportTime}): ${report.wip}
  </p>

  <label for="supervisorIssue">
    รายละเอียด / Issue
  </label>

  <textarea
    id="supervisorIssue"
    rows="5"
  ></textarea>

<p>
  <label for="supervisorImages">
    รูปภาพสำหรับส่ง LINE
  </label>
  <br>

  <input
    type="file"
    id="supervisorImages"
    accept="image/jpeg,image/png"
    multiple
  >
</p>

<p id="supervisorImageStatus">
  ยังไม่ได้เลือกรูป
</p>

<div
  id="supervisorImagePreview"
  style="
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  "
></div>

  <p>
    <button
      type="button"
      id="previewSupervisorButton"
    >
      👁️ ดูข้อความก่อนส่ง
    </button>
  </p>

  <div
    id="finalSupervisorPreview"
    style="display: none;"
  >
    <h3>ข้อความที่จะส่ง</h3>

    <pre
      id="finalSupervisorText"
      style="white-space: pre-wrap;"
    ></pre>
    
    <p>
      <button
        type="button"
        id="sendSupervisorButton"
      >
        📣 ส่งรายงานต่อหัวหน้า
      </button>
    </p>
    <button
  type="button"
  id="testShareButton"
>
  🧪 ทดสอบ LINE Share
</button>
  </div>
`;

document
  .getElementById('supervisorIssue')
  .value = report.issue || '';

const supervisorImages =
  document.getElementById('supervisorImages');

const supervisorImageStatus =
  document.getElementById('supervisorImageStatus');
const supervisorImagePreview =
  document.getElementById('supervisorImagePreview');

supervisorImages
  .addEventListener('change', function () {

    const files =
      Array.from(this.files);
    supervisorImagePreview.innerHTML = '';

    if (files.length === 0) {

      supervisorImageStatus.textContent =
        'ยังไม่ได้เลือกรูป';

      return;
    }


    const invalidFile =
      files.find(file =>
        file.type !== 'image/jpeg' &&
        file.type !== 'image/png'
      );


    if (invalidFile) {

      alert('รองรับเฉพาะรูป JPEG / PNG');

      this.value = '';

      supervisorImageStatus.textContent =
        'ยังไม่ได้เลือกรูป';

      return;
    }


    supervisorImageStatus.textContent =
      `เลือกรูปแล้ว ${files.length} รูป`;
    files.forEach(function (file) {

  const imageUrl =
    URL.createObjectURL(file);

  const img =
    document.createElement('img');

  img.src = imageUrl;

  img.style.width = '100px';
  img.style.height = '100px';
  img.style.objectFit = 'cover';
  img.style.borderRadius = '8px';

  img.onload = function () {
    URL.revokeObjectURL(imageUrl);
  };

  supervisorImagePreview.appendChild(img);

});
  });
        
document
  .getElementById('previewSupervisorButton')
  .addEventListener('click', function () {

    const finalPreview =
      document.getElementById('finalSupervisorPreview');

    const previewButton =
      document.getElementById('previewSupervisorButton');


    // ถ้าเปิด Preview อยู่ → ปิด
    if (finalPreview.style.display === 'block') {

      finalPreview.style.display = 'none';

      previewButton.textContent =
        '👁️ ดูข้อความก่อนส่ง';

      return;
    }


    // ถ้าปิดอยู่ → อ่านค่าปัจจุบัน
    const usableFixtures =
      document.getElementById('usableFixtures').value;

    const overallSituation =
      document.getElementById('overallSituation').value;

    const issue =
      document.getElementById('supervisorIssue')
        .value
        .trim();


    if (usableFixtures === '') {
      alert('กรุณากรอกจำนวน Fixtures ที่ใช้ได้');
      return;
    }


    const usableNumber =
      Number(usableFixtures);


    if (
      !Number.isInteger(usableNumber) ||
      usableNumber < 0 ||
      usableNumber > fixtureTotal
    ) {
      alert(
        `จำนวน Fixtures ต้องเป็น 0 - ${fixtureTotal}`
      );
      return;
    }


    const finalText =
`BFT TEAM
Date: ${report.date}
F7 ${report.shift}-SHIFT ${report.line}
MODEL: ${report.model}
STATION: FT
Number of usable fixtures (${reportTime}): ${usableNumber}/${fixtureTotal}
Overall situation: ${overallSituation}
Number of WIP (${reportTime}): ${report.wip}
${issue}`;


    document
      .getElementById('finalSupervisorText')
      .textContent = finalText;


    // เปิด Preview
    finalPreview.style.display = 'block';

    previewButton.textContent =
      '🙈 ปิดข้อความตัวอย่าง';

  });

      document
  .getElementById('sendSupervisorButton')
  .addEventListener('click', async  function () {

    const finalText =
      document
        .getElementById('finalSupervisorText')
        .textContent
        .trim();


    if (!finalText) {
      alert('กรุณาดูข้อความก่อนส่ง');
      return;
    }


    const confirmed =
      confirm(
        'ยืนยันส่งรายงานนี้ต่อหัวหน้า?\n\n' +
        finalText
      );


    if (!confirmed) {
      return;
    }


    // TEST ONLY
    // ขั้นนี้ยังไม่ส่ง LINE จริง
    const sendButton =
  document.getElementById(
    'sendSupervisorButton'
  );

try {

  sendButton.disabled = true;

  sendButton.textContent =
    'กำลังส่งทดสอบ...';


  const response =
    await fetch(
      GAS_URL,
      {
        method: 'POST',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body: JSON.stringify({
          action:
            'sendSupervisorReport',

          text:
            finalText
        })
      }
    );


  const data =
    await response.json();


  console.log(
    'SUPERVISOR SEND TEST:',
    data
  );


  if (!data.success) {
    throw new Error(
      data.error ||
      'GAS ไม่สามารถรับรายงานได้'
    );
  }


  if (data.testMode !== true) {
    throw new Error(
      'GAS ไม่ได้อยู่ใน TEST MODE'
    );
  }


  alert(
    'GAS รับ Supervisor Report สำเร็จ\n' +
    'ยังไม่ได้ส่ง LINE จริง'
  );


} catch (error) {

  console.error(error);

  alert(
    'ส่งข้อมูลทดสอบไม่สำเร็จ\n' +
    error.message
  );


 } finally {

  sendButton.disabled = false;

  sendButton.textContent =
    '📣 ส่งรายงานต่อหัวหน้า';

}

});
        document
  .getElementById('testShareButton')
  .addEventListener('click', async function () {

    try {

      if (!liff.isLoggedIn()) {
        alert('กรุณาเปิดหน้านี้ผ่าน LINE');
        return;
      }

      if (!liff.isApiAvailable('shareTargetPicker')) {
        alert(
          'อุปกรณ์นี้ไม่รองรับ Share Target Picker'
        );
        return;
      }

      const result =
        await liff.shareTargetPicker([
          {
            type: 'text',
            text:
              '[TEST] Supervisor Report'
          }
        ]);

      console.log(
        'SHARE RESULT:',
        result
      );

    } catch (error) {

      console.error(
        'SHARE ERROR:',
        error
      );

      alert(
        'เปิด LINE Share ไม่สำเร็จ\n' +
        error.message
      );

    }

  });
        

preview.style.display = 'block';


        

      } catch (error) {

        console.error(error);

        alert(
          'ค้นหารายงานไม่สำเร็จ\n' +
          error.message
        );


      } finally {

        button.disabled = false;
        button.textContent =
          '🔎 ค้นหารายงาน';

      }

    });

</script>
</body>

</html>
