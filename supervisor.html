<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Supervisor Report</title>

  <link
    rel="stylesheet"
    href="index3.css"
  >
</head>

<body>

  <h1>📣 ส่งรายงานต่อหัวหน้า</h1>

  <div>

    <p>
      <label>Date</label><br>

      <input
        type="date"
        id="supervisorDate"
      >
    </p>

    <p>
      <label>Shift</label><br>

      <select id="supervisorShift">

        <option value="">
          -- Select Shift --
        </option>

        <option value="DAY">
          DAY
        </option>

        <option value="Night">
          Night
        </option>

      </select>
    </p>

    <p>
      <label>Line</label><br>

      <select id="supervisorLine">

        <option value="">
          -- Select Line --
        </option>

        <option value="J17">
          J17
        </option>

        <option value="K27">
          K27
        </option>

      </select>
    </p>

    <p>
      <button
        type="button"
        id="searchSupervisorButton"
      >
        🔎 ค้นหารายงาน
      </button>
    </p>
    
    <div id="supervisorPreview" style="display: none;">
  <hr>

  <h2>Preview</h2>

  <div id="supervisorReportText"></div>

</div>

    <p>
      <button
        type="button"
        onclick="window.location.href='index.html'"
      >
        ← กลับหน้า Daily Report
      </button>
    </p>

  </div>
<script>
  document.addEventListener('DOMContentLoaded', function () {

    const dateInput =
      document.getElementById('supervisorDate');

    const today = new Date();

    const year =
      today.getFullYear();

    const month =
      String(today.getMonth() + 1)
        .padStart(2, '0');

    const day =
      String(today.getDate())
        .padStart(2, '0');

    dateInput.value =
      `${year}-${month}-${day}`;

  });
</script>

<script>

  const GAS_URL =
    'https://script.google.com/macros/s/AKfycbz14A1FjQRCWOT427jwoLhEG-UTRgPTFS8gguUWTppOJ4Jnjacd-QxQ4R4yD18Cx6i0/exec';


  document
    .getElementById('searchSupervisorButton')
    .addEventListener('click', async function () {

      const button = this;

      try {

        const dateValue =
          document.getElementById('supervisorDate').value;

        const shift =
          document.getElementById('supervisorShift').value;

        const line =
          document.getElementById('supervisorLine').value;


        if (!dateValue || !shift || !line) {
          alert('กรุณาเลือก Date / Shift / Line ให้ครบ');
          return;
        }


        const dateParts =
          dateValue.split('-');

        const reportDate =
          `${dateParts[0]}/${dateParts[1]}/${dateParts[2]}`;


        button.disabled = true;
        button.textContent = 'กำลังค้นหา...';


        const response = await fetch(
          GAS_URL,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body: JSON.stringify({
              action: 'findSupervisorReport',
              date: reportDate,
              shift: shift,
              line: line
            })
          }
        );


        const data =
          await response.json();


        console.log(
          'SUPERVISOR SEARCH RESULT:',
          data
        );


        if (!data.success) {
          throw new Error(
            data.error ||
            'เกิดข้อผิดพลาดในการค้นหารายงาน'
          );
        }


        if (!data.result.found) {

          alert(
            'ไม่พบรายงาน\n\n' +
            'Date: ' + reportDate + '\n' +
            'Shift: ' + shift + '\n' +
            'Line: ' + line
          );

          return;
        }


        const report = data.result;


        const preview =
          document.getElementById('supervisorPreview');
        
        const reportText =
          document.getElementById('supervisorReportText');
        
        reportText.innerHTML = `
          <p><strong>BFT TEAM</strong></p>
        
          <p>Date: ${report.date}</p>
        
          <p>
            F7 ${report.shift}-SHIFT ${report.line}
          </p>
        
          <p>MODEL: ${report.model}</p>
        
          <p>STATION: FT</p>
        
          <p>
            Number of WIP: ${report.wip}
          </p>
        
          <label>
            รายละเอียด / Issue
          </label>
        
          <textarea
            id="supervisorIssue"
            rows="5"
          ></textarea>
        `;
        
        document.getElementById(
          'supervisorIssue'
        ).value = report.issue || '';
        
        preview.style.display = 'block';


      } catch (error) {

        console.error(error);

        alert(
          'ค้นหารายงานไม่สำเร็จ\n' +
          error.message
        );


      } finally {

        button.disabled = false;
        button.textContent =
          '🔎 ค้นหารายงาน';

      }

    });

</script>
</body>

</html>
